<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MatheCheck - Mathe-Spaß für Kinder!</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Schwebende Hintergrund-Partikel -->
    <div id="bg-particles" class="bg-particles"></div>

    <!-- Willkommen-Screen -->
    <div id="screen-welcome" class="screen active">
        <div class="container">
            <h1 class="title rainbow-text">MatheCheck</h1>
            <p class="subtitle">Werde zum Mathe-Champion!</p>
            <div class="mascot mascot-big wiggle">🦊</div>
            <div class="welcome-form">
                <label for="player-name">Wie heißt du?</label>
                <input type="text" id="player-name" placeholder="Dein Name..." maxlength="20" autocomplete="off">
                <button id="btn-start" class="btn btn-primary btn-bounce" disabled>Los geht's! 🚀</button>
            </div>
        </div>
    </div>

    <!-- Level-Auswahl -->
    <div id="screen-levels" class="screen">
        <div class="container">
            <div class="header">
                <h2>Hallo, <span id="display-name"></span>! 👋</h2>
                <button id="btn-logout" class="btn btn-small">Anderer Spieler</button>
            </div>
            <h3 class="section-title">Wähle ein Level:</h3>
            <div class="level-grid">
                <button class="level-card level-unlocked" data-level="1">
                    <div class="level-icon level-icon-bounce">➕</div>
                    <div class="level-number">Level 1</div>
                    <div class="level-desc">Addition bis 20</div>
                    <div class="level-stars" id="stars-level-1"></div>
                </button>
                <button class="level-card level-unlocked" data-level="2">
                    <div class="level-icon level-icon-bounce">➖</div>
                    <div class="level-number">Level 2</div>
                    <div class="level-desc">Subtraktion bis 10</div>
                    <div class="level-stars" id="stars-level-2"></div>
                </button>
                <button class="level-card level-locked" disabled>
                    <div class="level-icon">🔒</div>
                    <div class="level-number">Level 3</div>
                    <div class="level-desc">Kommt bald!</div>
                </button>
            </div>
            <div class="stats-box">
                <h4>📊 Deine Statistik</h4>
                <div class="stats-grid">
                    <div class="stat">
                        <span class="stat-value" id="stat-rounds">0</span>
                        <span class="stat-label">Runden gespielt</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="stat-best">0</span>
                        <span class="stat-label">Bester Score</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Spiel-Screen -->
    <div id="screen-game" class="screen">
        <div class="container game-container">
            <!-- HUD -->
            <div class="game-hud">
                <span class="hud-level" id="game-level">LEVEL 1</span>
                <span class="hud-score" id="game-score">⭐ 0</span>
            </div>

            <!-- Fortschritt -->
            <div class="hud-progress">
                <div class="hud-progress-bar">
                    <div class="hud-progress-fill" id="progress-fill"></div>
                </div>
                <span class="hud-progress-text" id="progress-text">0/30</span>
            </div>

            <!-- Spielwelt Viewport -->
            <div class="game-viewport" id="game-viewport">
                <div class="game-world" id="game-world">
                    <!-- Wird dynamisch generiert -->
                </div>
            </div>

            <!-- Streak -->
            <div id="streak-display" class="streak-display hidden"></div>

            <!-- Aufgabe + Antwort -->
            <div class="game-area">
                <div class="task-display" id="task-display">
                    <span id="task-num1">5</span>
                    <span id="task-op">+</span>
                    <span id="task-num2">3</span>
                    <span class="task-equals">=</span>
                    <span class="task-question">?</span>
                </div>
                <div class="answer-area">
                    <div id="answer-display" class="answer-display">?</div>
                </div>
                <div class="numpad">
                    <button class="numpad-btn" data-num="1">1</button>
                    <button class="numpad-btn" data-num="2">2</button>
                    <button class="numpad-btn" data-num="3">3</button>
                    <button class="numpad-btn" data-num="4">4</button>
                    <button class="numpad-btn" data-num="5">5</button>
                    <button class="numpad-btn" data-num="6">6</button>
                    <button class="numpad-btn" data-num="7">7</button>
                    <button class="numpad-btn" data-num="8">8</button>
                    <button class="numpad-btn" data-num="9">9</button>
                    <button class="numpad-btn numpad-del" data-action="delete">⌫</button>
                    <button class="numpad-btn" data-num="0">0</button>
                    <button class="numpad-btn numpad-ok" data-action="submit">OK</button>
                </div>
                <div id="feedback" class="feedback hidden"></div>
            </div>

            <!-- Countdown Overlay -->
            <div id="countdown-overlay" class="countdown-overlay hidden">
                <div id="countdown-number" class="countdown-num">3</div>
            </div>
        </div>
    </div>

    <!-- Ergebnis-Screen -->
    <div id="screen-result" class="screen">
        <div class="container">
            <div id="result-mascot" class="mascot mascot-result wiggle">🥳</div>
            <h2 id="result-title" class="result-title">Runde geschafft!</h2>
            <div class="result-stats">
                <div class="result-score">
                    <span class="big-score" id="result-score">25</span>
                    <span class="score-label">von 30 richtig</span>
                </div>
                <div class="result-stars" id="result-stars"></div>
                <div class="result-message" id="result-message"></div>
            </div>
            <div class="joke-box">
                <div class="joke-label">🤡 Witz des Tages:</div>
                <p class="joke-text" id="joke-text"></p>
            </div>
            <div class="result-buttons">
                <button id="btn-retry" class="btn btn-primary btn-bounce">Nochmal spielen! 🔄</button>
                <button id="btn-back-levels" class="btn btn-secondary">Zurück zur Auswahl</button>
            </div>
        </div>
    </div>

    <!-- Konfetti Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <script src="js/storage.js"></script>
    <script src="js/jokes.js"></script>
    <script src="js/sounds.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
